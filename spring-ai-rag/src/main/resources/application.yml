server:
  port: 8080
  # 普通 JSON / 文本响应开启 Gzip；text/event-stream 不在列表里，避免影响 SSE 逐字输出
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript,image/svg+xml

app:
  cors:
    # 生产环境用 APP_CORS_ALLOWED_ORIGINS 覆盖为实际域名
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173

spring:
  application:
    name: spring-ai-rag

  # 没有显式指定 profile 时（例如在 IDEA 里直接点 Run）使用本机可跑的 local：
  # 本机 MySQL + 内存向量库，不依赖 Docker / Milvus。
  # 要用 MySQL + Milvus（并可用 Attu 查看），请显式指定 --spring.profiles.active=milvus。
  profiles:
    default: local

  # 本地密钥放在项目根目录 .env（已在 .gitignore），IDEA / mvn spring-boot:run
  # 的工作目录都是项目根目录，因此无需再手工配置环境变量。
  config:
    import: optional:file:./.env[.properties]

  # ---------------- MySQL ----------------
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:springai_rag}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  # ---------------- Redis ----------------
  # 保存 JWT 会话与在线状态；本机没有 Redis 时请先启动 redis-server。
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s

  # ---------------- Spring AI ----------------
  ai:
    model:
      # 对话：内网网关（同时兼容 Anthropic / OpenAI 协议，这里走 OpenAI 协议，回答更干净）
      chat: openai
      # Embedding：独立服务（对话网关不提供 embedding）
      embedding: openai
      # 本项目用不到下面这些模型，显式关闭，避免无谓的自动装配
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      # 对话：内网网关 http://192.168.0.227，模型 deepseek-v4-flash
      # 沿用你当前 shell 里的 ANTHROPIC_* 变量名，避免多记一套配置
      chat:
        api-key: ${ANTHROPIC_AUTH_TOKEN:}
        base-url: ${ANTHROPIC_BASE_URL:http://192.168.0.227}
        options:
          model: ${ANTHROPIC_MODEL:deepseek-v4-flash}
          temperature: 0.2
          max-tokens: ${CHAT_MAX_TOKENS:2048}

      # Embedding：指向任意 OpenAI 兼容服务（硅基流动 / 阿里百炼 / 智谱 / 本地 vLLM 等）
      embedding:
        api-key: ${EMBEDDING_API_KEY:}
        base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        options:
          model: ${EMBEDDING_MODEL:BAAI/bge-m3}

    vectorstore:
      type: milvus
      milvus:
        client:
          host: ${MILVUS_HOST:localhost}
          port: ${MILVUS_PORT:19530}
          username: ${MILVUS_USERNAME:root}
          password: ${MILVUS_PASSWORD:Milvus}
        database-name: ${MILVUS_DATABASE:default}
        collection-name: rag_documents
        # 必须与 embedding 模型的输出维度一致，bge-m3 为 1024
        embedding-dimension: ${EMBEDDING_DIMENSION:1024}
        index-type: ivf-flat
        metric-type: cosine
        initialize-schema: true
        auto-id: false

rag:
  auth:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖；长度至少 32 字节
    jwt-secret: ${JWT_SECRET:xinli-demo-jwt-secret-please-change-in-production-2026}
    token-ttl: ${JWT_TTL:7d}
    online-window: ${AUTH_ONLINE_WINDOW:15m}
  top-k: 5
  similarity-threshold: 0.35
  max-context-chars: 4000
  chunk-size: 500
  min-chunk-size-chars: 50
  min-chunk-length-to-embed: 10
  max-num-chunks: 1000
  history-window: 6

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.example.rag: INFO
